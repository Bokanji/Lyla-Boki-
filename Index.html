<meta name="theme-color" content="#d6409f">
<style>
:root{--bg:#fff0f6;--card:#fffafc;--tx:#4a2040;--mu:#9a6b88;--ac:#d6409f;--ac2:#fde0ef;--bd:#f6c8de;--rd:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1426;--card:#361c31;--tx:#fde8f3;--mu:#d9a3c2;--ac:#ff7ec3;--ac2:#4f2547;--bd:#55294d;--rd:#ff8a8a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a1426;--card:#361c31;--tx:#fde8f3;--mu:#d9a3c2;--ac:#ff7ec3;--ac2:#4f2547;--bd:#55294d;--rd:#ff8a8a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:20px;margin:0}
select,input,button{font:inherit;color:var(--tx)}
select,input{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;min-width:0}
button{border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--mu);padding:6px 8px;font-weight:400}
button.sec{background:var(--ac2);color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 4px;font-size:13px}
nav button.on{color:var(--ac)}
nav span{display:block;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.row input{flex:1;min-width:110px}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}
.it .t{flex:1;min-width:0;overflow-wrap:anywhere}
.it.done .t{text-decoration:line-through;color:var(--mu)}
.mu{color:var(--mu);font-size:13px}
.it input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}
.bal{font-size:18px;font-weight:700;color:var(--ac)}
.hide{display:none}
#st{color:var(--mu);font-size:13px;margin:6px 0}
button{background:linear-gradient(135deg,#ff7ec3,#d6409f)}
h1{color:var(--ac)}
.card{box-shadow:0 2px 10px rgba(214,64,159,.14)}
.deco{text-align:center;font-size:22px;letter-spacing:6px;margin:-2px 0 10px;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.55;transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.deco{animation:none}}
.ttl{display:flex;align-items:center;gap:10px;min-width:0}
.tile{width:52px;height:52px;flex:none;border-radius:16px;object-fit:cover;border:2px solid var(--ac);box-shadow:0 2px 10px rgba(214,64,159,.35)}
h1{font-size:18px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mh button{font-size:24px;padding:2px 14px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd div{text-align:center;font-size:12px;color:var(--mu);padding-bottom:2px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1;padding:0;background:transparent;color:var(--tx);border-radius:12px;font-weight:500;border:1.5px solid transparent}
.day i{font-style:normal;font-size:10px;line-height:8px;height:8px;color:var(--ac);letter-spacing:1px}
.day.td{border-color:var(--ac)}
.day.sel{background:var(--ac);color:#fff}
.day.sel i{color:#fff}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>n.toLocaleString("en-IE",{style:"currency",currency:"EUR"});
let col=null,items=[],names=null,me="a",loaded=false;
try{me=localStorage.getItem("me")||"a"}catch(e){}
const nm=k=>names?(names[k]||(k==="a"?"Person 1":"Person 2")):"";
const by=t=>items.filter(i=>i.type===t);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const add=o=>col&&col.add(Object.assign({ts:Date.now()},o)).catch(()=>alert("Could not save"));
const upd=(id,o)=>col&&col.doc(id).update(o).catch(()=>{});
const del=id=>col&&col.doc(id).delete().catch(()=>{});

function opts(sel,both){
  const el=$(sel),v=el.value;
  el.innerHTML=(both?'<option value="x">Both</option>':'')+`<option value="a">${esc(nm("a"))}</option><option value="b">${esc(nm("b"))}</option>`;
  el.value=v||(both?"x":me);
}
let sel=today(),cy=+sel.slice(0,4),cm=+sel.slice(5,7)-1;
function renderCal(){
const first=new Date(cy,cm,1),lead=(first.getDay()+6)%7,days=new Date(cy,cm+1,0).getDate(),evs={};
$("#mt").textContent=first.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
by("event").forEach(e=>(evs[e.date]=evs[e.date]||[]).push(e));
let h="<div></div>".repeat(lead);
for(let d=1;d<=days;d++){const k=cy+"-"+String(cm+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"),n=(evs[k]||[]).length;
h+=`<button class="day${k===today()?" td":""}${k===sel?" sel":""}" data-day="${k}"><span>${d}</span><i>${"•".repeat(Math.min(n,3))}</i></button>`}
$("#cg").innerHTML=h}
function render(){
  $("#setup").classList.toggle("hide",!!names||!col);
  opts("#me");$("#me").value=me;opts("#eW");opts("#tW",true);
  const empty='<div class="mu">Nothing here yet 🐱</div>';
  const chk=i=>`<input type="checkbox" ${i.done?"checked":""} data-c="${i.id}">`;
  const x=i=>`<button class="ghost" data-d="${i.id}" aria-label="Delete">✕</button>`;
  const sh=by("shop").sort((p,q)=>(p.done?1:0)-(q.done?1:0)||p.ts-q.ts);
  $("#l-shop").innerHTML=sh.map(i=>`<div class="it ${i.done?"done":""}">${chk(i)}<div class="t">${esc(i.text)}</div>${x(i)}</div>`).join("")||empty;
  const td=by("todo").sort((p,q)=>(p.done?1:0)-(q.done?1:0)||p.ts-q.ts);
  $("#l-todo").innerHTML=td.map(i=>`<div class="it ${i.done?"done":""}">${chk(i)}<div class="t">${esc(i.text)}<div class="mu">${i.who==="x"?"Both":esc(nm(i.who))}</div></div>${x(i)}</div>`).join("")||empty;
  renderCal();const ev=by("event").filter(e=>e.date===sel).sort((p,q)=>(p.date+(p.time||"")).localeCompare(q.date+(q.time||"")));
  $("#l-cal").innerHTML=ev.map(e=>`<div class="it"><div class="t"><b>${esc(e.text)}</b><div class="mu">${new Date(e.date+"T00:00").toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"2-digit"})}${e.time?" · "+esc(e.time):""}</div></div>${x(e)}</div>`).join("")||'<div class="mu">Nothing planned this day 🧚</div>';
  const ex=by("exp").sort((p,q)=>q.ts-p.ts);
  let a=0;
  ex.forEach(e=>{const d=e.settle?e.amt:e.amt/2;a+=e.by==="a"?d:-d});
  a=Math.round(a*100)/100;
  $("#bal").innerHTML=!names?"":a===0?'<span class="bal">All squared up! 🐱✨</span>':`<span class="bal">${esc(nm(a>0?"b":"a"))} owes ${esc(nm(a>0?"a":"b"))} ${eur(Math.abs(a))}</span><div style="margin-top:8px"><button class="sec" id="settle">Settle up</button></div>`;
  $("#l-exp").innerHTML=ex.map(e=>`<div class="it"><div class="t">${e.settle?"🤝 Settled up":esc(e.text)}<div class="mu">${esc(nm(e.by))} paid</div></div><b>${eur(e.amt)}</b>${x(e)}</div>`).join("")||empty;
  $("#settle")&&($("#settle").onclick=()=>{add({type:"exp",settle:true,text:"Settle up",amt:Math.abs(a),by:a>0?"b":"a"})});
}
$("#pm").onclick=()=>{if(--cm<0){cm=11;cy--}render()};
$("#nm2").onclick=()=>{if(++cm>11){cm=0;cy++}render()};
$("#cg").onclick=e=>{const b=e.target.closest("[data-day]");if(!b)return;sel=b.dataset.day;$("#cD").value=sel;render()};
$("#f-cal").addEventListener("submit",()=>setTimeout(()=>{$("#cD").value=sel},0));
$("#cD").value=sel;
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("nav button").forEach(n=>n.classList.toggle("on",n===b));
  ["shop","cal","exp","todo"].forEach(t=>$("#p-"+t).classList.toggle("hide",t!==b.dataset.t));};
$("#me").onchange=e=>{me=e.target.value;try{localStorage.setItem("me",me)}catch(x){}opts("#eW")};
document.addEventListener("change",e=>{const c=e.target.dataset&&e.target.dataset.c;if(c)upd(c,{done:e.target.checked})});
document.addEventListener("click",e=>{const d=e.target.dataset&&e.target.dataset.d;if(d)del(d)});
$("#clr").onclick=()=>by("shop").filter(i=>i.done).forEach(i=>del(i.id));
$("#nsave").onclick=()=>{const a=$("#na").value.trim(),b=$("#nb").value.trim();if(!a||!b)return;
  col.doc("names").set({type:"cfg",a,b}).catch(()=>alert("Could not save"))};
const sub=(id,fn)=>$(id).onsubmit=e=>{e.preventDefault();fn();e.target.reset();opts("#eW");opts("#tW",true)};
sub("#f-shop",()=>add({type:"shop",text:$("#shopIn").value.trim(),done:false}));
sub("#f-todo",()=>add({type:"todo",text:$("#tT").value.trim(),who:$("#tW").value,done:false}));
sub("#f-cal",()=>add({type:"event",text:$("#cT").value.trim(),date:$("#cD").value,time:$("#cH").value}));
sub("#f-exp",()=>{const v=parseFloat($("#eA").value.replace(",","."));if(!(v>0))return alert("Please enter a valid amount");
  add({type:"exp",text:$("#eT").value.trim(),amt:Math.round(v*100)/100,by:$("#eW").value})});

let cfg=null;try{cfg=JSON.parse(localStorage.getItem("cfg"))}catch(e){}
const hp=new URLSearchParams(location.hash.slice(1));
if(hp.get("u")&&hp.get("c")){cfg={u:hp.get("u"),c:hp.get("c")};try{localStorage.setItem("cfg",JSON.stringify(cfg))}catch(e){}}
if(hp.get("m")==="a"||hp.get("m")==="b"){me=hp.get("m");try{localStorage.setItem("me",me)}catch(e){}}
const hf=m=>"#u="+encodeURIComponent(cfg.u)+"&c="+encodeURIComponent(cfg.c)+"&m="+m;
function makeCol(base){
  let cache={},cb=null,eb=null;
  const u=p=>base+(p?"/"+p:"")+".json";
  const emit=()=>cb&&cb({docs:Object.keys(cache).map(id=>({id,data:()=>cache[id]}))});
  const pull=async()=>{try{const r=await fetch(u());if(!r.ok)throw 0;cache=(await r.json())||{};emit()}catch(e){eb&&eb()}};
  const send=(m,p,b)=>fetch(u(p),{method:m,body:b?JSON.stringify(b):undefined}).then(r=>{if(!r.ok)throw 0}).then(pull);
  return{
    add:o=>{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);cache[id]=o;emit();return send("PUT",id,o)},
    doc:id=>({
      set:o=>{cache[id]=o;emit();return send("PUT",id,o)},
      update:o=>{cache[id]=Object.assign(cache[id]||{},o);emit();return send("PATCH",id,o)},
      delete:()=>{delete cache[id];emit();return send("DELETE",id)}}),
    onSnapshot:(n,e)=>{cb=n;eb=e;pull();setInterval(()=>{if(!document.hidden)pull()},4000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()})}
  };
}
function boot(){
  $("#cfg").classList.toggle("hide",!!cfg);$("#inv").classList.toggle("hide",!cfg);
  if(!cfg){$("#st").textContent="";return}
  history.replaceState(null,"",hf(me));
  col=makeCol(cfg.u.replace(/\/+$/,"")+"/home/"+encodeURIComponent(cfg.c)+"/items");
  col.onSnapshot(s=>{loaded=true;$("#st").textContent="";
    items=s.docs.map(d=>Object.assign({id:d.id},d.data()));
    names=items.find(i=>i.type==="cfg")||null;render()},
    ()=>{$("#st").textContent="Could not reach the database. Please check your connection."});
}
$("#cok").onclick=()=>{
  const u=$("#dbu").value.trim().replace(/\/+$/,""),c=$("#hc").value.trim();
  if(!/^https:\/\/\S+firebase\S*$/.test(u)||!/^[A-Za-z0-9_-]{8,}$/.test(c))return alert("Please enter the database URL and a code with at least 8 letters or numbers (no spaces).");
  cfg={u,c};try{localStorage.setItem("cfg",JSON.stringify(cfg))}catch(e){}
  boot();render()};
$("#inv").onclick=async()=>{
  const l=location.origin+location.pathname+hf(me==="a"?"b":"a");
  try{await navigator.clipboard.writeText(l);alert("Invite link copied!")}catch(e){prompt("Copy this link:",l)}};
$("#me").addEventListener("change",()=>{if(cfg)history.replaceState(null,"",hf(me))});
boot();render();
</script></body></html>
