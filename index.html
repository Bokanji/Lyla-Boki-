<style>
:root{--bg:#fff0f6;--card:#fffafc;--tx:#4a2040;--mu:#9a6b88;--ac:#d6409f;--ac2:#fde0ef;--bd:#f6c8de;--rd:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1426;--card:#361c31;--tx:#fde8f3;--mu:#d9a3c2;--ac:#ff7ec3;--ac2:#4f2547;--bd:#55294d;--rd:#ff8a8a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a1426;--card:#361c31;--tx:#fde8f3;--mu:#d9a3c2;--ac:#ff7ec3;--ac2:#4f2547;--bd:#55294d;--rd:#ff8a8a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:20px;margin:0}
select,input,button{font:inherit;color:var(--tx)}
select,input{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;min-width:0}
button{border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--mu);padding:6px 8px;font-weight:400}
button.sec{background:var(--ac2);color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 4px;font-size:13px}
nav button.on{color:var(--ac)}
nav span{display:block;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.row input{flex:1;min-width:110px}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}
.it .t{flex:1;min-width:0;overflow-wrap:anywhere}
.it.done .t{text-decoration:line-through;color:var(--mu)}
.mu{color:var(--mu);font-size:13px}
.it input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}
.bal{font-size:18px;font-weight:700;color:var(--ac)}
.hide{display:none}
#st{color:var(--mu);font-size:13px;margin:6px 0}
button{background:linear-gradient(135deg,#ff7ec3,#d6409f)}
h1{color:var(--ac)}
.card{box-shadow:0 2px 10px rgba(214,64,159,.14)}
.deco{text-align:center;font-size:22px;letter-spacing:6px;margin:-2px 0 10px;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.55;transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.deco{animation:none}}
.ttl{display:flex;align-items:center;gap:10px;min-width:0}
.tile{width:52px;height:52px;flex:none;border-radius:16px;object-fit:cover;border:2px solid var(--ac);box-shadow:0 2px 10px rgba(214,64,159,.35)}
h1{font-size:18px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mh button{font-size:24px;padding:2px 14px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd div{text-align:center;font-size:12px;color:var(--mu);padding-bottom:2px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1;padding:0;background:transparent;color:var(--tx);border-radius:12px;font-weight:500;border:1.5px solid transparent}
.day i{font-style:normal;font-size:10px;line-height:8px;height:8px;color:var(--ac);letter-spacing:1px}
.day.td{border-color:var(--ac)}
.day.sel{background:var(--ac);color:#fff}
.day.sel i{color:#fff}
#today{background:var(--ac2);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.5}
#today .ghost{padding:2px 0;font-size:12px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;border-radius:14px;padding:10px 14px;z-index:20;box-shadow:0 4px 14px rgba(214,64,159,.4)}
.od{color:var(--rd);font-weight:600}
.row label{display:flex;align-items:center;gap:6px;font-size:14px}
nav button{position:relative}
.bdg{position:absolute;top:4px;right:12%;background:var(--rd);color:#fff;border-radius:10px;font-size:11px;padding:0 6px}
.bub{background:var(--ac2);border-radius:12px;padding:8px 10px}
.bub.me{background:var(--card);border:1px solid var(--bd)}
.nw{background:var(--ac);color:#fff;border-radius:8px;padding:1px 6px;font-size:11px}
#p-news{background-image:radial-gradient(var(--bd) 1px,transparent 1px);background-size:18px 18px;border-radius:14px;padding:6px 6px 72px;min-height:55vh}
.sep{text-align:center;margin:10px 0 6px}
.sep span{background:var(--card);border:1px solid var(--bd);color:var(--mu);font-size:12px;border-radius:10px;padding:2px 10px}
.sep.nwd span{background:var(--ac2);color:var(--ac);font-weight:600}
.sys{text-align:center;margin:6px 0}
.sys span{display:inline-block;background:var(--ac2);color:var(--mu);font-size:12px;border-radius:10px;padding:4px 10px;max-width:92%}
.mr{display:flex;margin:3px 0}
.mr.me{justify-content:flex-end}
.bb{max-width:82%;padding:7px 10px 4px;font-size:15.5px;line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.mr.me .bb{background:var(--ac);color:#fff;border-radius:14px 14px 4px 14px}
.mr.th .bb{background:var(--card);color:var(--tx);border-radius:14px 14px 14px 4px}
.tm{float:right;margin:6px 0 0 10px;font-size:11px;opacity:.75;white-space:nowrap}
.mr.me .tm .rd{color:#bfeaff}
.bx{background:none;border:0;color:inherit;opacity:.6;padding:0 0 0 4px;font-size:11px}
.cmpw{position:fixed;left:0;right:0;bottom:var(--nh,64px);z-index:15;background:var(--bg);border-top:1px solid var(--bd)}
.cmp{display:flex;gap:8px;padding:8px 10px;margin:0}
.stp{padding:6px 10px;max-height:38vh;overflow:auto;border-bottom:1px solid var(--bd)}
.sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
#ste{grid-template-columns:repeat(6,1fr);gap:2px}
#ste.hide,#stm.hide{display:none}
.stab{display:flex;gap:6px;margin-bottom:6px}
.stab button{padding:5px 10px;font-size:13px}
.stab button.on{background:var(--ac);color:#fff}
.si{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;border-radius:10px;padding:2px;font-size:20px}
.si img{max-width:100%;max-height:100%}
.si .xx{position:absolute;top:0;right:0;background:var(--rd);color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;line-height:20px;text-align:center}
.addt{font-size:13px;color:var(--ac);border:1.5px dashed var(--ac);border-radius:12px;line-height:1.2}
.skimg{display:block;max-width:150px;max-height:150px}
#stp.hide{display:none}
.sk{background:none;font-size:30px;padding:4px 0;border-radius:10px}
.stk{font-size:64px;line-height:1.15;padding:2px 4px}
.stk .tm{display:block;float:none;margin:0;text-align:right;color:var(--mu);opacity:1}
.mr .stk .tm .rd{color:#2a9fd6}
.cmp input{flex:1;border-radius:22px;padding:10px 14px}
.cmp button{width:42px;height:42px;border-radius:50%;padding:0;font-size:18px}
</style></head>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>n.toLocaleString("en-IE",{style:"currency",currency:"EUR"});
let col=null,items=[],names=null,me="a",loaded=false;
try{me=localStorage.getItem("me")||"a"}catch(e){}
const nm=k=>names?(names[k]||(k==="a"?"Person 1":"Person 2")):"";
const by=t=>items.filter(i=>i.type===t);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const add=o=>col&&col.add(Object.assign({ts:Date.now(),u:me},o)).catch(()=>alert("Could not save"));
const upd=(id,o)=>col&&col.doc(id).update(o).catch(()=>{});
const del=id=>col&&col.doc(id).delete().catch(()=>{});

function opts(sel,both){
  const el=$(sel),v=el.value;
  el.innerHTML=(both?'<option value="x">Both</option>':'')+`<option value="a">${esc(nm("a"))}</option><option value="b">${esc(nm("b"))}</option>`;
  el.value=v||(both?"x":me);
}

function applyStream(c,path,data){
  const p=path.split("/").filter(Boolean);
  if(!p.length)return data||{};
  if(p.length===1){if(data==null)delete c[p[0]];else c[p[0]]=data;return c}
  const o=(c[p[0]]=c[p[0]]||{});
  if(data==null)delete o[p[1]];else o[p[1]]=data;
  if(!Object.keys(o).length)delete c[p[0]];
  return c}
function makeCol(base){

  try{cache=JSON.parse(localStorage.getItem(ck))||{}}catch(e){}
  const u=p=>base+(p?"/"+p:"")+".json";
  const emit=()=>{if(cb)cb({docs:Object.keys(cache).map(id=>({id,data:()=>cache[id]}))});try{localStorage.setItem(ck,JSON.stringify(cache))}catch(e){}};
  const stop=()=>{if(es){es.close();es=null}};
  const stream=()=>{stop();es=new EventSource(u());
    const h=ev=>{try{const d=JSON.parse(ev.data);
      if(ev.type==="put")cache=applyStream(cache,d.path,d.data);
      else for(const k in d.data)cache=applyStream(cache,d.path.replace(/\/$/,"")+"/"+k,d.data[k]);
      emit()}catch(e){}};
    es.addEventListener("put",h);es.addEventListener("patch",h);
    es.addEventListener("cancel",()=>eb&&eb());es.onerror=()=>eb&&eb()};
  const send=(m,p,b)=>fetch(u(p),{method:m,body:b==null?undefined:JSON.stringify(b)}).then(r=>{if(!r.ok)throw 0}).catch(e=>{if(!document.hidden)stream();throw e});
  return{
    add:o=>{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);cache[id]=o;emit();return send("PUT",id,o)},
    doc:id=>({
      set:o=>{cache[id]=o;emit();return send("PUT",id,o)},
      update:o=>{cache[id]=Object.assign(cache[id]||{},o);emit();return send("PATCH",id,o)},
      delete:()=>{delete cache[id];emit();return send("DELETE",id)}}),
    onSnapshot:(n,e)=>{cb=n;eb=e;if(Object.keys(cache).length)emit();stream();
      document.addEventListener("visibilitychange",()=>{if(document.hidden)stop();else stream()})}
  };
}

    else if(i.type==="msg"&&now-i.ts>60*D)del(i.id)})}
function boot(){
  $("#cfg").classList.toggle("hide",!!cfg);$("#inv").classList.toggle("hide",!cfg);
  if(!cfg){$("#st").textContent="";return}
  history.replaceState(null,"",hf(me));
  col=makeCol(cfg.u.replace(/\/+$/,"")+"/home/"+encodeURIComponent(cfg.c)+"/items");
  col.onSnapshot(s=>{loaded=true;$("#st").textContent="";
    items=s.docs.map(d=>Object.assign({id:d.id},d.data()));
    names=items.find(i=>i.type==="cfg")||null;render();notify();cleanup()},
    ()=>{$("#st").textContent="Could not reach the database. Please check your connection."});
}
$("#cok").onclick=()=>{
  const u=$("#dbu").value.trim().replace(/\/+$/,""),c=$("#hc").value.trim();
  if(!/^https:\/\/\S+firebase\S*$/.test(u)||!/^[A-Za-z0-9_-]{8,}$/.test(c))return alert("Please enter the database URL and a code with at least 8 letters or numbers (no spaces).");
  cfg={u,c};try{localStorage.setItem("cfg",JSON.stringify(cfg))}catch(e){}
  boot();render()};
$("#inv").onclick=async()=>{
  const l=location.origin+location.pathname+hf(me==="a"?"b":"a");
  try{await navigator.clipboard.writeText(l);alert("Invite link copied!")}catch(e){prompt("Copy this link:",l)}};
$("#me").addEventListener("change",()=>{if(cfg)history.replaceState(null,"",hf(me))});
$("#ics").onclick=exportIcs;
sub("#f-news",()=>{newsScroll=true;add({type:"msg",text:$("#mT").value.trim()})});
$("#stb").onclick=()=>$("#stp").classList.toggle("hide");
$("#stp").onclick=e=>{const b=e.target.closest("[data-sk]");if(!b)return;newsScroll=true;add({type:"msg",text:b.dataset.sk,st:true});$("#stp").classList.add("hide")};
$("#stp").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;
  const m=b.dataset.tab==="m";$("#ste").classList.toggle("hide",m);$("#stm").classList.toggle("hide",!m);
  document.querySelectorAll(".stab button").forEach(x=>x.classList.toggle("on",x===b));
  if(m)loadLib()});
$("#stm").onclick=e=>{const t=e.target;
  if(t.closest("#stadd"))return $("#stf").click();
  if(t.closest("#stpaste"))return pasteStk();
  if(t.closest("#stedit")){stkEdit=!stkEdit;return renderStm()}
  const d=t.closest("[data-del]");if(d)return delStk(d.dataset.del);
  const s=t.closest("[data-send]");
  if(s&&!stkEdit){newsScroll=true;add({type:"msg",text:"🖼️ sticker",stk:s.dataset.send});$("#stp").classList.add("hide")}};
$("#stf").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)addStkBlob(f)};
boot();render();
</script></body></html>
